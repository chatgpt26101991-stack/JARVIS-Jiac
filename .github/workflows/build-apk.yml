name: Compilar APK JARVIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Extraer codigo fuente
        run: mkdir -p source && unzip -q JARVIS-Jiac-v0.3.1-source.zip -d source
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar SDK 36 y ajustar dependencias
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          sed -i 's/compileSdk = 37/compileSdk = 36/' source/app/build.gradle.kts
          sed -i 's/compose-bom:2026.09.00/compose-bom:2025.09.00/' source/app/build.gradle.kts
          sed -i 's/activity-compose:1.13.0/activity-compose:1.11.0/' source/app/build.gradle.kts
          sed -i 's/lifecycle-viewmodel-compose:2.11.0/lifecycle-viewmodel-compose:2.9.4/' source/app/build.gradle.kts
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Ejecutar pruebas
        working-directory: source
        run: gradle :app:testDebugUnitTest
      - name: Generar APK
        working-directory: source
        run: gradle :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Jiac-v0.1-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
